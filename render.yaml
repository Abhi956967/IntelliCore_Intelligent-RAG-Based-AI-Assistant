services:
  - type: web
    name: intellicore-backend
    runtime: python
    plan: starter
    region: oregon
    healthCheckPath: /health
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: python run.py
    autoDeployTrigger: commit
    disk:
      name: intellicore-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENV
        value: production
      - key: APP_STORAGE_DIR
        value: /var/data
      - key: LLM_PROVIDER
        value: google
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
